# Runs on every pull request: lint, build, and no conflict markers left behind.
name: Checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: No conflict markers
        run: "! grep -rIn '^<<<<<<< \\|^>>>>>>> ' src base44"
      - run: npm run lint
      - run: npm run build
